name: Custom Windows Release

on:
  push:
    branches:
      - ryan/ceo-office-sidebar
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version greater than the currently installed version (for example 1.4.169-ceo.20260805.1)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: custom-windows-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: windows-latest
    env:
      ORCA_UPDATE_OWNER: YAYPLANET-Ryan
      ORCA_UPDATE_REPO: orca-ceo-office
    steps:
      - name: Checkout custom branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        shell: pwsh
        run: corepack enable

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Resolve release version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if ($env:INPUT_VERSION) {
            $version = $env:INPUT_VERSION
          } else {
            $packageBase = node -p "require('./package.json').version.split('-')[0]"
            $packageParts = $packageBase.Split('.')
            $base = [version]::new(
              [int]$packageParts[0],
              [int]$packageParts[1],
              ([int]$packageParts[2] + 1)
            )

            $releaseTags = gh release list `
              --repo "$env:GITHUB_REPOSITORY" `
              --limit 100 `
              --json tagName `
              --jq '.[].tagName'
            foreach ($releaseTag in $releaseTags) {
              if ($releaseTag -match '^v?(\d+)\.(\d+)\.(\d+)(?:-|$)') {
                $candidate = [version]::new(
                  [int]$Matches[1],
                  [int]$Matches[2],
                  [int]$Matches[3]
                )
                if ($candidate -gt $base) {
                  $base = $candidate
                }
              }
            }

            $core = "$($base.Major).$($base.Minor).$($base.Build)"
            $date = (Get-Date).ToUniversalTime().ToString('yyyyMMdd')
            $version = "$core-ceo.$date.$env:RUN_NUMBER"
          }
          "ORCA_RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "Resolved release version: $version"

      - name: Build desktop
        shell: pwsh
        run: pnpm run build:release

      - name: Build Windows installer
        shell: pwsh
        run: |
          pnpm run ensure:electron-runtime
          pnpm exec electron-builder --config config/electron-builder.config.cjs --win --publish never

      - name: Write Windows installer checksum
        shell: pwsh
        run: |
          $installer = "dist/orca-windows-setup.exe"
          if (-not (Test-Path -LiteralPath $installer)) {
            throw "Missing Windows installer: $installer"
          }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  orca-windows-setup.exe" | Set-Content -LiteralPath "$installer.sha256" -Encoding ascii

      - name: Publish Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v$env:ORCA_RELEASE_VERSION"
          $assets = @(
            "dist/orca-windows-setup.exe",
            "dist/orca-windows-setup.exe.sha256",
            "dist/orca-windows-setup.exe.blockmap",
            "dist/latest.yml"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset)) {
              throw "Missing release asset: $asset"
            }
          }
          gh release create $tag @assets --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title $env:ORCA_RELEASE_VERSION --notes "Custom Orca Windows build with the CEO Office sidebar."
