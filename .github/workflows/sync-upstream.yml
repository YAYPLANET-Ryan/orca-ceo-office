name: Sync Orca Upstream

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: sync-orca-upstream
  cancel-in-progress: false

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout custom branch
        uses: actions/checkout@v4
        with:
          ref: ryan/ceo-office-sidebar
          fetch-depth: 0

      - name: Compare upstream
        id: compare
        shell: bash
        run: |
          git remote add upstream https://github.com/stablyai/orca.git
          git fetch upstream main --quiet
          if git diff --quiet HEAD upstream/main; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Merge upstream into the custom branch
        if: steps.compare.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "orca-upstream-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit upstream/main
          git push origin HEAD:ryan/ceo-office-sidebar

      - name: Start the custom Windows release
        if: steps.compare.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run custom-windows-release.yml --repo "$GITHUB_REPOSITORY" --ref ryan/ceo-office-sidebar
